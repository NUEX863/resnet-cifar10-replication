
name: Check Commit Messages

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate student ID and full name
        uses: actions/github-script@v7
        with:
          script: |
            // Replace with your actual group members
            const members = {
              "github_user_1": {
                id: "2260031698",
                name: "周子旺"
              },
              "github_user_2": {
                id: "260912346",
                name: "Li Si"
              }
            };

            const commits = await github.paginate(
              github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            );

            const errors = [];

            for (const item of commits) {
              const login = item.author?.login;
              const member = members[login];
              const message = item.commit.message
                .split("\n")[0];

              if (!member) {
                errors.push(
                  `${item.sha.slice(0, 7)}: Unknown author ${login}`
                );
                continue;
              }

              const prefix =
                `[${member.id}] ${member.name} - `;

              if (
                !message.startsWith(prefix) ||
                !message.slice(prefix.length).trim()
              ) {
                errors.push(
                  `${item.sha.slice(0, 7)}: Invalid message: ${message}`
                );
              }
            }

            if (errors.length) {
              core.setFailed(errors.join("\n"));
            }
